#!/bin/bash
CLUSTER_DOMAIN_SUFFIX=${CLUSTER_DOMAIN_SUFFIX:=cluster.local}
POD_ORDINAL=${HOSTNAME##*-}

if ! [[ "$POD_ORDINAL" =~ ^[0-9]+$ ]]; then
  echo "Unable to derive pod ordinal from HOSTNAME=$HOSTNAME" >&2
  exit 1
fi

SERVER_ID=$((POD_ORDINAL + 1))

sed 's/$hostname/'$(hostname -f)'/' "$CONFIGMAP_PATH" |
  sed "s/\.svc\.${CLUSTER_DOMAIN_SUFFIX}//" |
  sed 's/$server_id/'"$SERVER_ID"'/'

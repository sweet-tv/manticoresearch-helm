{{- if .Values.serviceMonitor.enabled  }}
{{- if and .Values.serviceMonitor.targetComponent (not (has .Values.serviceMonitor.targetComponent (list "worker" "balancer"))) }}
{{- fail "serviceMonitor.targetComponent must be empty, worker, or balancer" }}
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "manticoresearch.fullname" . }}-metrics-svc
  labels:
    name: {{ include "manticoresearch.fullname" . }}-metrics-svc
    {{- include "manticoresearch.labels" . | nindent 4 }}
spec:
  ports:
    - name: metrics
      port: 80
      targetPort: {{ index .Values.exporter.annotations "prometheus.io/port" }}
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    {{- with .Values.serviceMonitor.targetComponent }}
    app.kubernetes.io/component: {{ . | quote }}
    {{- end }}
{{- end  }}
